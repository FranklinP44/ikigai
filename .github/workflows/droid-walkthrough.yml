name: Droid PR Walkthrough

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: droid-walkthrough-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  walkthrough:
    # Fork PRs get no secrets, and drafts are not ready to explain yet.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'droid-walkthrough')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      WT_DIR: ${{ runner.temp }}/droid-walkthrough
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load walkthrough files from the base branch
        id: load
        shell: bash
        run: |
          # Config, prompts, and script come from the base branch so a PR cannot rewrite its own walkthrough rules.
          mkdir -p "$WT_DIR"
          for f in config.json pass1-candidates.md pass2-validate.md walkthrough.py; do
            if ! git show "$BASE_SHA:.github/droid-walkthrough/$f" > "$WT_DIR/$f" 2>/dev/null; then
              echo "::notice::.github/droid-walkthrough/$f is not on the base branch yet, so the walkthrough is skipped."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check pull request size
        id: size
        if: steps.load.outputs.skip == 'false'
        run: python3 "$WT_DIR/walkthrough.py" size

      - name: Install Droid CLI
        if: steps.size.outputs.run == 'true'
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "Pass 1: draft walkthrough comments"
        if: steps.size.outputs.run == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$WT_DIR/walkthrough.py" pass1

      - name: "Pass 2: validate comments"
        if: steps.size.outputs.run == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 "$WT_DIR/walkthrough.py" pass2

      - name: Post walkthrough review
        if: steps.size.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$WT_DIR/walkthrough.py" post
