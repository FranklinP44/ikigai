name: Publish wiki to Confluence

on:
  push:
    branches: [main]
    paths:
      - "droid-wiki/**"
      - ".github/scripts/**"
      - ".github/workflows/publish-wiki-to-confluence.yml"
  pull_request:
    paths:
      - "droid-wiki/**"
      - ".github/scripts/**"
      - ".github/workflows/publish-wiki-to-confluence.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Convert and render only; do not write to Confluence"
        type: boolean
        default: false

permissions:
  contents: read

# Real publishes share one queue so two runs never write at the same time;
# pull request dry runs get their own group per branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('confluence-dry-run-{0}', github.ref) || 'confluence-publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
      WIKI_DIR: droid-wiki
    steps:
      - uses: actions/checkout@v4

      - name: Check Confluence configuration
        env:
          CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
          CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          if [ ! -f "$WIKI_DIR/.wiki-meta.json" ]; then
            echo "::error title=Wiki not found::$WIKI_DIR/.wiki-meta.json does not exist in this commit."
            exit 1
          fi
          missing=""
          for name in CONFLUENCE_URL CONFLUENCE_SPACE_KEY CONFLUENCE_EMAIL CONFLUENCE_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "Confluence configuration found. Dry run: $DRY_RUN"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Confluence checks skipped::Missing:$missing. The dry run will convert pages and render diagrams but skip the read-only Confluence checks."
          else
            echo "::error title=Missing Confluence configuration::Missing:$missing. Add repository variables CONFLUENCE_URL and CONFLUENCE_SPACE_KEY and secrets CONFLUENCE_EMAIL and CONFLUENCE_API_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@11

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Publish to Confluence
        env:
          CONFLUENCE_URL: ${{ vars.CONFLUENCE_URL }}
          CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_ROOT_TITLE: ${{ vars.CONFLUENCE_ROOT_TITLE }}
          CONFLUENCE_PARENT_ID: ${{ vars.CONFLUENCE_PARENT_ID }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          args="--out build/confluence"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python .github/scripts/publish_confluence.py $args

      - name: Upload converted pages and diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confluence-preview
          path: build/confluence/
          if-no-files-found: ignore
          retention-days: 14
