name: Droid Auto Review

# Runs only on demand: add the droid-review label to a pull request to start a code and security
# review. While the label is present, new commits re-run the code review.
on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    # The droid-action label_trigger input is not used, so the label gate lives here. On labeled
    # events, only the droid-review label itself starts a run, so unrelated labels don't re-run it.
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'droid-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'droid-review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          allowed_bots: factory-droid
          automatic_security_review: true
          review_depth: shallow
